# Conda environment for the REDaCT reproducibility repo.
#
#   conda env create -f environment.yml
#   conda activate redact
#
# Versions mirror the development env (Python 3.11). Only the KEY direct
# dependencies the code imports are listed — not the full transitive closure.
# torch is pinned to a CUDA 12.4 build; on CPU-only or a different CUDA
# toolkit, install the matching torch wheel from https://pytorch.org first,
# then `pip install -r requirements.txt` for the rest.
name: redact
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core modeling stack
      - torch==2.5.1
      - transformers==5.4.0
      - tokenizers==0.22.2
      - datasets==4.8.4
      - accelerate==1.13.0
      - safetensors==0.7.0
      - huggingface-hub==1.8.0
      # Embeddings: MU cosine metric + knowledge-bank build
      - sentence-transformers==5.3.0
      # ROC / AUROC for the leak-classifier metrics
      - scikit-learn==1.8.0
      # Numerics
      - numpy==2.4.4
      - scipy==1.17.1
      # Evaluation metrics (ROUGE / entailment / sentence-splitting)
      - rouge-score==0.1.2
      - nltk==3.9.4
      # Misc utilities
      - tqdm==4.67.3
      - PyYAML==6.0.3
