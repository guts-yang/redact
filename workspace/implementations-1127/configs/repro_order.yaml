# Frozen reproducibility settings from the proposals.
frozen:
  dtype: fp32            # matmul precision (CUBLAS_WORKSPACE_CONFIG=:4096:8)
  seeds: [1001, 2002]
  base_model: LRM-target
  lora: {r: 8, alpha: 32, target: [q_proj, k_proj, v_proj, o_proj]}
  tf32: false

# T0/T1/T2/T3 meaning (same scaffold for every method; see each proposal §4).
experiment_scaffold:
  T0: "baseline reproduction (R2MU / CoT-only GA / prior method)"
  T1: "full proposed method"
  T2: "ablate the core mechanism"
  T3: "ablate the cross-condition / attack-axis alignment"

# Training scale used by `scripts/run_all.py --decisive`. It is deliberately
# above the 8-step / 4+4 / 256 smoke, but it is still TRAINING ONLY: T0-T3
# require real generation-side metrics from `scripts/eval_decisive.py` (not
# implemented yet) and must not be read off the relaxed losses in
# train_summary.json.
#
# SINGLE-GPU MEMORY LIMIT (measured 2026-11-28 on H20 95 GiB, fp32 8B + LoRA):
#   8+8 / 1024  -> OOM (94.3 GiB; [B,L,V] logits + CE intermediates)
#   8+8 /  512  -> OOM
#   8+8 /  384  -> OOM
#   4+4 / 1024  -> OOM
#   bf16 8+8/1024 -> OOM (logits, not weights, are the bottleneck)
#   gradient_checkpointing 8+8/1024 -> OOM
#   4+4 /  512  -> OK
#   8+8 /  256  -> OK
# The original 8+8/1024 preset OOM'd all 20 decisive jobs. Lowered to 4+4/512
# (2x context vs smoke, 25x steps); do not raise without re-measuring.
decisive_preset:
  steps: 200
  n_forget: 4
  n_retain: 4
  max_len: 512
  lr: 1.0e-4

